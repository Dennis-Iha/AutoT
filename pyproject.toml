[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autot"
version = "0.1.0"
description = "AT (AutoT) - offline AI speech translation engine"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "webrtcvad-wheels>=2.0.11",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "ctranslate2>=4.0,<5",
    "sentencepiece>=0.2.0",
    "subword-nmt>=0.3.8",
    "sacremoses>=0.0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
at-audio-demo = "tools.mic_vad_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
