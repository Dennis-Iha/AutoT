name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system audio/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config portaudio19-dev libsndfile1-dev

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check core tools tests

      - name: Type check (mypy)
        run: python -m mypy core tools

      - name: Test (pytest)
        run: python -m pytest -v
